# Render blueprint: one web service (Dockerfile, embedded worker) + one Postgres. See README "Deploy to Render".
# Secrets marked sync: false are entered in the Render dashboard when the blueprint is first applied; they never
# live in the repo. Synthetic data only until the AI provider has no-training terms (TODO: paid API).
services:
  - type: web
    name: inbox-helper
    runtime: docker
    plan: free
    region: singapore          # must match the database region
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass   # deploy a push only after the GitHub checks (CI) pass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inbox-helper-db
          property: connectionString
      - key: AUTH_MODE
        value: google
      - key: SESSION_SECRET
        generateValue: true
      # PUBLIC_URL is not needed: Render sets RENDER_EXTERNAL_URL, which the app uses for the OAuth callback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: inbox-helper-db
    plan: free
    region: singapore
    databaseName: inbox
    user: inbox
