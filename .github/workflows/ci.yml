name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      judge:
        description: "Also run the LLM-judged eval metrics (reported, not gated; uses many judge calls)"
        type: choice
        options: [none, gemini, gemini-newest]
        default: none

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: inbox
          POSTGRES_DB: inbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inbox -d inbox_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PG_URL: postgresql+psycopg://inbox:inbox@localhost:5432/inbox_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply from scratch with the CLI, and match the models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on Postgres
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: python -m pytest -q tests/test_api.py tests/test_worker.py tests/test_migrations.py tests/test_auth.py

  frontend:
    name: Frontend build (type check + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  audit:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Python (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Frontend (npm audit, dev tools included)
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Docker image + stack smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Start Postgres, web and worker
        run: |
          docker compose up -d --no-build --wait db web
          docker compose up -d --no-build worker
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          test "$(docker compose exec -T db psql -U inbox -d inbox -tAc 'select version_num from alembic_version')" \
            = "$(docker compose run --rm --no-deps -T web alembic heads | cut -d' ' -f1)"
          for i in $(seq 1 15); do docker compose logs worker | grep -q "waiting for jobs" && break; sleep 1; done
          docker compose logs worker | grep -q "waiting for jobs"
      - name: Logs
        if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  eval-gate:
    name: Eval gate (prompts are code)
    needs: backend
    runs-on: ubuntu-latest
    concurrency:
      group: eval-gate  # one at a time: runs share the free-tier API quota
      cancel-in-progress: false
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            evals/requirements.txt
      - run: pip install -r evals/requirements.txt
      - name: Golden dataset is consistent (no network)
        run: python -m evals.check_goldens
      - name: API key present
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add a GEMINI_API_KEY (or OPENROUTER_API_KEY) repository secret: the eval gate runs the real models."
            exit 1
          fi
      # Cache entries are keyed on the exact prompt text, so a prompt edit always misses. This file-hash key also
      # starts from an empty cache when the models or provider settings change, which the prompt text does not
      # show. Unchanged files cost no API calls.
      - name: Restore model-output cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: evals/.cache
          key: eval-outputs-${{ hashFiles('inbox_helper/prompt.py', 'inbox_helper/config.py', 'inbox_helper/pipeline.py', 'inbox_helper/providers.py', 'policies/**', 'evals/goldens.json') }}
      - name: Run the pipeline on every golden and score it
        # run_eval exits 1 whenever any case fails (some known misses always do); the gate below decides.
        run: python -m evals.run_eval --live --judge "${{ inputs.judge || 'none' }}" || echo "run_eval reported failing cases"
      - name: Compare with evals/baseline.json
        run: python -m evals.gate
      - name: Save model-output cache
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('evals/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: evals/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/runs/
          if-no-files-found: ignore
